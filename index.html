<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Semanal Corporativa</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #151d2a;
            --card-border: #232f42;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 16px; }
        
        .container { width: 100%; max-width: 1280px; }
        
        /* Card Base */
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 20px; }
        
        /* Login */
        #login-screen { max-width: 400px; margin: 50px auto; }
        h2 { color: var(--accent); margin-bottom: 20px; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        h3 { color: var(--text-main); margin-bottom: 16px; font-size: 15px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; font-weight: 600; }
        
        /* Formulários e Inputs */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        input[type="text"], input[type="password"], input[type="date"], select, textarea { width: 100%; padding: 10px 14px; background: #0b0f19; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 13px; outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15); }
        
        /* Checkboxes Dias da Semana */
        .checkbox-days-wrapper { background: #0b0f19; padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); }
        .quick-select-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--card-border); font-size: 12px; color: var(--accent); font-weight: 600; cursor: pointer; }
        .checkbox-days { display: flex; flex-wrap: wrap; gap: 10px; }
        .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-main); cursor: pointer; width: 48%; }
        .checkbox-item input[type="checkbox"], .quick-select-bar input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

        /* Botões */
        button { border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; width: 100%; }
        .btn-success:hover { filter: brightness(0.9); }
        .btn-pdf { background: #e11d48; color: white; }
        .btn-pdf:hover { background: #be123c; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 3px 6px; font-size: 10px; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-copy { background: rgba(2, 132, 199, 0.2); color: #7dd3fc; padding: 3px 6px; font-size: 10px; border: 1px solid rgba(2, 132, 199, 0.3); margin-right: 2px; }
        .btn-copy:hover { background: var(--primary); color: white; }
        .btn-logout { background: #232f42; color: var(--text-main); padding: 8px 14px; font-size: 12px; }
        .btn-logout:hover { background: #334155; }
        
        .btn-toggle-dropdown { background: #0b0f19; border: 1px solid var(--card-border); color: var(--accent); width: 100%; justify-content: space-between; font-size: 13px; padding: 10px 14px; margin-bottom: 10px; border-radius: 8px; }
        .dropdown-content { background: #0b0f19; border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; margin-bottom: 15px; max-height: 220px; overflow-y: auto; }

        .manage-list-item { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; border-left: 3px solid var(--accent); font-size: 12px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .user-badge { background: var(--primary); padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
        
        .week-picker-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; background: #0b0f19; padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); }
        .week-picker-bar input[type="date"] { width: 100%; }

        /* ESTILO DA TABELA MATRICIAL TELA (MODERNO DARK) */
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid var(--card-border); }
        .excel-table { width: 100%; border-collapse: collapse; background-color: var(--card-bg); color: var(--text-main); font-size: 12px; text-align: center; }
        .excel-table th, .excel-table td { border: 1px solid var(--card-border); padding: 8px 6px; vertical-align: middle; }
        
        .excel-table th.header-colab { background: linear-gradient(135deg, #0284c7, #0369a1) !important; color: #ffffff !important; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        .excel-table th.header-day { background-color: #1e293b !important; color: var(--accent) !important; font-weight: 700; font-size: 11px; }
        .excel-table th.header-date { background-color: #0f172a !important; color: var(--text-muted) !important; font-weight: 600; font-size: 10px; }
        .excel-table th.weekend-text { color: #f43f5e !important; }
        
        .excel-table td.col-colaborador { background-color: #1e293b !important; color: #f8fafc !important; font-weight: 700; width: 170px; text-align: left; padding-left: 10px; font-size: 11px; word-break: break-word; border-right: 2px solid var(--primary); }
        
        /* Task Cards/Chips dentro da Célula */
        .cell-task-item { background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); color: #e0f2fe; padding: 5px 6px; border-radius: 6px; margin-bottom: 4px; font-weight: 600; font-size: 10px; text-transform: uppercase; line-height: 1.3; text-align: left; }
        .cell-task-item:last-child { margin-bottom: 0; }
        .cell-task-actions { display: flex; justify-content: flex-end; gap: 2px; margin-top: 4px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 3px; }

        .admin-form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            body { padding: 8px; }
            .card { padding: 14px; }
            .checkbox-item { width: 100%; }
            .week-picker-bar input[type="date"] { width: 100%; }
            .admin-form-row { grid-template-columns: 1fr; }
        }

        /* CONFIGURAÇÃO DE IMPRESSÃO / PDF CORPORATIVO CLEAN */
        @media print {
            @page { size: landscape; margin: 6mm; }
            body { background: #ffffff !important; color: #0f172a !important; padding: 0 !important; }
            .container { max-width: 100% !important; width: 100% !important; }
            #login-screen, #admin-panel, .header, .week-picker-bar, .btn-toggle-dropdown, .cell-task-actions, button { display: none !important; }
            .card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
            .table-responsive { overflow: visible !important; border: none !important; }
            
            .excel-table { font-size: 8.5pt !important; width: 100% !important; background: #ffffff !important; color: #000000 !important; }
            .excel-table th, .excel-table td { border: 1px solid #cbd5e1 !important; padding: 5px 4px !important; }
            
            .excel-table th.header-colab { background-color: #0284c7 !important; color: #ffffff !important; font-size: 9pt !important; }
            .excel-table th.header-day { background-color: #f1f5f9 !important; color: #0f172a !important; font-size: 8.5pt !important; }
            .excel-table th.header-date { background-color: #ffffff !important; color: #475569 !important; font-size: 8pt !important; }
            .excel-table th.weekend-text { color: #e11d48 !important; }
            
            .excel-table td.col-colaborador { background-color: #f8fafc !important; color: #0f172a !important; border-right: 2px solid #0284c7 !important; font-size: 8.5pt !important; }
            
            .cell-task-item { background-color: #f0f9ff !important; border: 1px solid #bae6fd !important; color: #0369a1 !important; padding: 3px 4px !important; font-size: 7.5pt !important; font-weight: 700 !important; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="card">
        <h2>🔒 Agenda Corporativa</h2>
        <form onsubmit="realizarLogin(event)">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="loginUser" required placeholder="Digite seu usuário">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPass" required placeholder="Digite sua senha">
            </div>
            <button type="submit" class="btn-primary">Entrar no Sistema</button>
        </form>
    </div>

    <!-- TELA PRINCIPAL -->
    <div id="main-screen" class="hidden">
        
        <!-- CABEÇALHO -->
        <div class="header card" style="margin-bottom: 15px; padding: 12px 20px;">
            <div>
                <span style="font-size: 15px; font-weight: 600;">👋 Olá, <span id="displayUserName" style="color: var(--accent);"></span></span>
                <span id="adminBadge" class="user-badge hidden" style="margin-left: 6px; background: var(--warning); color: #000;">ADMIN</span>
            </div>
            <button onclick="logout()" class="btn-logout">Sair</button>
        </div>

        <!-- PAINEL ADMINISTRADOR -->
        <div id="admin-panel" class="hidden">
            
            <!-- ABA SUSPENSA: GERENCIAR COLABORADORES -->
            <button class="btn-toggle-dropdown" onclick="toggleDropdown('dropdownColaboradores')">
                <span>👥 Gerenciar Colaboradores Cadastrados</span>
                <span>▼</span>
            </button>
            <div id="dropdownColaboradores" class="dropdown-content hidden">
                <div id="listaColaboradoresAdmin"></div>
            </div>

            <!-- ABA SUSPENSA: GERENCIAR CLIENTES / LOCAIS -->
            <button class="btn-toggle-dropdown" onclick="toggleDropdown('dropdownClientes')">
                <span>🏢 Gerenciar Lista de Clientes/Locais</span>
                <span>▼</span>
            </button>
            <div id="dropdownClientes" class="dropdown-content hidden">
                <div id="listaClientesAdmin"></div>
            </div>

            <!-- Cadastrar Usuário -->
            <div class="card">
                <h3>👤 Cadastrar Novo Colaborador</h3>
                <form onsubmit="cadastrarUsuario(event)" class="admin-form-row">
                    <div class="form-group">
                        <label>Nome / Usuário</label>
                        <input type="text" id="newUsername" placeholder="Ex: AGNALDO TELLES" required>
                    </div>
                    <div class="form-group">
                        <label>Função Padrão</label>
                        <input type="text" id="newUserRole" placeholder="Ex: OBRA, DPM, GESTÃO" required>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="newPassword" placeholder="Senha" required>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button type="submit" class="btn-success">+ Criar Colaborador</button>
                    </div>
                </form>
            </div>

            <!-- Agendar Função -->
            <div class="card">
                <h3>📌 Agendar Função / Destino</h3>
                <form onsubmit="agendarTarefa(event)">
                    <div class="admin-form-row">
                        <div class="form-group">
                            <label>Colaborador 1 *</label>
                            <select id="scheduleUserSelect1" class="user-select-box" onchange="atualizarFuncaoAuto(1)" required>
                                <option value="">Carregando...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Colaborador 2 (Opcional)</label>
                            <select id="scheduleUserSelect2" class="user-select-box">
                                <option value="">Nenhum</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Prefixo / Função</label>
                            <input type="text" id="scheduleRole" placeholder="Ex: OBRA, DPM, GESTÃO" required>
                        </div>
                        <div class="form-group">
                            <label>Cliente / Local</label>
                            <input type="text" id="scheduleLocation" placeholder="Ex: SHOP_PARTAGE-DF" required list="clientesDataList">
                            <datalist id="clientesDataList"></datalist>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Selecione os Dias da Semana *</label>
                        <div class="checkbox-days-wrapper">
                            <label class="quick-select-bar">
                                <input type="checkbox" id="selectAllWeekdays" onchange="toggleSegundaSexta(this.checked)">
                                ⚡ Selecionar Semana Inteira (Segunda a Sexta)
                            </label>
                            <div class="checkbox-days" id="checkboxDaysContainer"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Instruções / Descrição Opcional</label>
                        <textarea id="scheduleDesc" rows="2" placeholder="Instruções adicionais..."></textarea>
                    </div>
                    <button type="submit" class="btn-success">Lançar na Agenda</button>
                </form>
            </div>
        </div>

        <!-- AGENDA SEMANAL MATRICIAL -->
        <div class="card">
            <div class="week-picker-bar">
                <div style="flex: 1; min-width: 200px;">
                    <label>Selecione o Dia/Mês:</label>
                    <input type="date" id="weekPickerDate" onchange="atualizarSemanaPorData(this.value)">
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px; width: 100%;">
                    <span style="font-size: 12px; color: var(--accent); font-weight: 700;" id="weekRangeLabel"></span>
                    <button onclick="exportarPDF()" class="btn-pdf" style="width: 100%;">📄 Baixar Agenda (PDF)</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="excel-table" id="tablaAgendaMatricial">
                    <thead>
                        <tr id="rowDiasNomes"></tr>
                        <tr id="rowDiasDatas"></tr>
                    </thead>
                    <tbody id="tbodyMatricial"></tbody>
                </table>
            </div>
        </div>

    </div>

</div>

<!-- ELEMENTOS INVISÍVEIS PARA TRANSFERÊNCIA AO GOOGLE APPS SCRIPT -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
<form id="googleSheetForm" method="POST" target="hidden_iframe" style="display:none;">
    <input type="hidden" name="data" id="googleSheetDataInput">
</form>

<script>
    const DIAS_NOMES_CURTOS = ["SEG", "TER", "QUA", "QUI", "SEX", "SAB", "DOM"];
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9zeHGoDDk8Tch7gBhS355k4B8CXV8BiRhZU2AVOovsnoWuwyp8phHhHyY4oZ-vhwh5Q/exec';

    let usuarios = JSON.parse(localStorage.getItem('app_usuarios')) || [
        { user: 'admin', pass: 'Rafa180993', role: 'admin', funcao: 'ADMIN' },
        { user: 'AGNALDO TELLES', pass: '123', role: 'user', funcao: 'DPM' },
        { user: 'HAMILTON CESAR', pass: '123', role: 'user', funcao: 'OBRA' }
    ];

    let clientes = JSON.parse(localStorage.getItem('app_clientes')) || [];
    let agendamentos = JSON.parse(localStorage.getItem('app_agendamentos')) || [];
    let usuarioLogado = null;
    let datasDaSemanaAtual = [];

    function realizarLogin(e) {
        e.preventDefault();
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value.trim();

        const usuarioEncontrado = usuarios.find(user => user.user.toLowerCase() === u.toLowerCase() && user.pass === p);

        if (usuarioEncontrado) {
            usuarioLogado = usuarioEncontrado;
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            carregarAplicacao();
        } else {
            alert('❌ Usuário ou senha incorretos!');
        }
    }

    function logout() {
        usuarioLogado = null;
        document.getElementById('main-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }

    function carregarAplicacao() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        document.getElementById('displayUserName').innerText = usuarioLogado.user;

        const isAdmin = usuarioLogado.role === 'admin';

        if (isAdmin) {
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('adminBadge').classList.remove('hidden');
            atualizarSelectUsuarios();
            renderizarListasAdmin();
        } else {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('adminBadge').classList.add('hidden');
        }

        const hojeISO = new Date().toISOString().split('T')[0];
        document.getElementById('weekPickerDate').value = hojeISO;
        
        atualizarSemanaPorData(hojeISO);
    }

    function toggleDropdown(id) {
        const elemento = document.getElementById(id);
        elemento.classList.toggle('hidden');
    }

    function atualizarSemanaPorData(dataString) {
        if (!dataString) return;

        const partes = dataString.split('-');
        const data = new Date(Date.UTC(partes[0], partes[1] - 1, partes[2]));

        let diaDaSemana = data.getUTCDay();
        let diferencaParaSegunda = diaDaSemana === 0 ? -6 : 1 - diaDaSemana;

        const segundaFeira = new Date(data);
        segundaFeira.setUTCDate(data.getUTCDate() + diferencaParaSegunda);

        datasDaSemanaAtual = [];
        for (let i = 0; i < 7; i++) {
            const diaTemp = new Date(segundaFeira);
            diaTemp.setUTCDate(segundaFeira.getUTCDate() + i);
            const iso = diaTemp.toISOString().split('T')[0];
            const dataFmt = diaTemp.getUTCDate().toString().padStart(2, '0') + '/' + (diaTemp.getUTCMonth() + 1).toString().padStart(2, '0') + '/' + diaTemp.getUTCFullYear();
            
            datasDaSemanaAtual.push({
                nomeDia: DIAS_NOMES_CURTOS[i],
                dataISO: iso,
                dataFormatada: dataFmt,
                isWeekday: i < 5,
                isWeekend: i >= 5
            });
        }

        const inicioSemana = datasDaSemanaAtual[0].dataFormatada;
        const fimSemana = datasDaSemanaAtual[6].dataFormatada;
        document.getElementById('weekRangeLabel').innerText = `Semana de ${inicioSemana} até ${fimSemana}`;

        renderizarCheckboxesDias();
        renderizarAgenda();
    }

    function renderizarCheckboxesDias() {
        const container = document.getElementById('checkboxDaysContainer');
        if (!container) return;
        container.innerHTML = '';

        document.getElementById('selectAllWeekdays').checked = false;

        datasDaSemanaAtual.forEach(diaInfo => {
            const label = document.createElement('label');
            label.className = 'checkbox-item';
            label.innerHTML = `
                <input type="checkbox" name="selectedDay" value="${diaInfo.dataISO}" data-weekday="${diaInfo.isWeekday}" onchange="verificarToggleSemana()">
                ${diaInfo.nomeDia} (${diaInfo.dataFormatada.substring(0,5)})
            `;
            container.appendChild(label);
        });
    }

    function toggleSegundaSexta(checked) {
        const checkboxes = document.querySelectorAll('input[name="selectedDay"]');
        checkboxes.forEach(cb => {
            if (cb.getAttribute('data-weekday') === 'true') {
                cb.checked = checked;
            }
        });
    }

    function verificarToggleSemana() {
        const checkboxesWeekdays = document.querySelectorAll('input[name="selectedDay"][data-weekday="true"]');
        const todosMarcados = Array.from(checkboxesWeekdays).every(cb => cb.checked);
        document.getElementById('selectAllWeekdays').checked = todosMarcados;
    }

    function atualizarFuncaoAuto(colabIndex) {
        if (colabIndex === 1) {
            const username = document.getElementById('scheduleUserSelect1').value;
            const u = usuarios.find(user => user.user === username);
            if (u && u.funcao) {
                document.getElementById('scheduleRole').value = u.funcao;
            }
        }
    }

    function cadastrarUsuario(e) {
        e.preventDefault();
        const u = document.getElementById('newUsername').value.trim().toUpperCase();
        const f = document.getElementById('newUserRole').value.trim().toUpperCase();
        const p = document.getElementById('newPassword').value.trim();

        if (usuarios.some(user => user.user.toLowerCase() === u.toLowerCase())) {
            alert('⚠️ Este colaborador já está cadastrado!');
            return;
        }

        usuarios.push({ user: u, pass: p, role: 'user', funcao: f || 'GERAL' });
        salvarDados();
        alert(`✅ Colaborador "${u}" criado com sucesso!`);
        
        document.getElementById('newUsername').value = '';
        document.getElementById('newUserRole').value = '';
        document.getElementById('newPassword').value = '';
        atualizarSelectUsuarios();
        renderizarListasAdmin();
        renderizarAgenda();
    }

    function excluirUsuario(userNome) {
        if (confirm(`Deseja realmente excluir o colaborador "${userNome}" e remover todas as tarefas dele?`)) {
            usuarios = usuarios.filter(u => u.user !== userNome);
            agendamentos = agendamentos.filter(ev => ev.usuario !== userNome);
            salvarDados();
            atualizarSelectUsuarios();
            renderizarListasAdmin();
            renderizarAgenda();
        }
    }

    function excluirCliente(clienteNome) {
        if (confirm(`Deseja remover o cliente "${clienteNome}" da lista de sugestões?`)) {
            clientes = clientes.filter(c => c !== clienteNome);
            salvarDados();
            renderizarListasAdmin();
        }
    }

    function renderizarListasAdmin() {
        const containerColab = document.getElementById('listaColaboradoresAdmin');
        containerColab.innerHTML = '';
        
        const colaboradores = usuarios.filter(u => u.role !== 'admin');
        if (colaboradores.length === 0) {
            containerColab.innerHTML = '<p style="font-size:12px; color:var(--text-muted);">Nenhum colaborador cadastrado além do Admin.</p>';
        } else {
            colaboradores.forEach(colab => {
                const item = document.createElement('div');
                item.className = 'manage-list-item';
                item.innerHTML = `
                    <span>👤 <b>${colab.user}</b> <small style="color:var(--accent);">(${colab.funcao || 'Sem Função'})</small></span>
                    <button class="btn-danger" onclick="excluirUsuario('${colab.user}')">🗑️ Excluir</button>
                `;
                containerColab.appendChild(item);
            });
        }

        const containerClientes = document.getElementById('listaClientesAdmin');
        const datalist = document.getElementById('clientesDataList');
        containerClientes.innerHTML = '';
        datalist.innerHTML = '';

        if (clientes.length === 0) {
            containerClientes.innerHTML = '<p style="font-size:12px; color:var(--text-muted);">Nenhum cliente cadastrado ainda.</p>';
        } else {
            clientes.forEach(cli => {
                const item = document.createElement('div');
                item.className = 'manage-list-item';
                item.innerHTML = `
                    <span>🏢 <b>${cli}</b></span>
                    <button class="btn-danger" onclick="excluirCliente('${cli}')">🗑️ Excluir</button>
                `;
                containerClientes.appendChild(item);

                const opt = document.createElement('option');
                opt.value = cli;
                datalist.appendChild(opt);
            });
        }
    }

    function atualizarSelectUsuarios() {
        const selects = document.querySelectorAll('.user-select-box');
        
        selects.forEach((select, index) => {
            select.innerHTML = index === 0 
                ? '<option value="">Selecione o Colaborador 1...</option>' 
                : '<option value="">Nenhum (Apenas 1 colaborador)</option>';
            
            usuarios.forEach(user => {
                if(user.role !== 'admin') {
                    const option = document.createElement('option');
                    option.value = user.user;
                    option.innerText = user.user + ` (${user.funcao || 'GERAL'})`;
                    select.appendChild(option);
                }
            });
        });
    }

    function enviarParaGoogleSheets(listaEventos) {
        if (!GOOGLE_SCRIPT_URL) return;

        const form = document.getElementById('googleSheetForm');
        const input = document.getElementById('googleSheetDataInput');
        
        form.action = GOOGLE_SCRIPT_URL;
        input.value = JSON.stringify(listaEventos);
        
        form.submit();
    }

    function agendarTarefa(e) {
        e.preventDefault();
        const u1 = document.getElementById('scheduleUserSelect1').value;
        const u2 = document.getElementById('scheduleUserSelect2').value;
        const funcao = document.getElementById('scheduleRole').value.trim().toUpperCase();
        const local = document.getElementById('scheduleLocation').value.trim().toUpperCase();
        const desc = document.getElementById('scheduleDesc').value.trim();

        const checkboxesMarcados = document.querySelectorAll('input[name="selectedDay"]:checked');
        const diasSelecionados = Array.from(checkboxesMarcados).map(cb => cb.value);

        if (!u1) {
            alert('Por favor, selecione pelo menos o Colaborador 1.');
            return;
        }

        if (diasSelecionados.length === 0) {
            alert('Por favor, marque pelo menos um dia da semana!');
            return;
        }

        if (local && !clientes.includes(local)) {
            clientes.push(local);
        }

        const listaUsuarios = [u1];
        if (u2 && u2 !== u1) {
            listaUsuarios.push(u2);
        }

        let novosLancamentos = [];

        diasSelecionados.forEach(dataIso => {
            listaUsuarios.forEach(user => {
                const novoEvento = {
                    id: Date.now() + Math.random(),
                    usuario: user,
                    funcao: funcao || 'GERAL',
                    data: dataIso,
                    local: local,
                    desc: desc
                };
                agendamentos.push(novoEvento);
                novosLancamentos.push(novoEvento);
            });
        });

        salvarDados();
        enviarParaGoogleSheets(novosLancamentos);

        alert(`📌 ${novosLancamentos.length} agendamento(s) salvo(s) na agenda e enviado(s) para a planilha!`);

        document.getElementById('scheduleLocation').value = '';
        document.getElementById('scheduleDesc').value = '';
        document.querySelectorAll('input[name="selectedDay"]').forEach(cb => cb.checked = false);
        document.getElementById('selectAllWeekdays').checked = false;

        renderizarListasAdmin();
        renderizarAgenda();
    }

    function duplicarEvento(id) {
        const eventoOriginal = agendamentos.find(ev => ev.id === id);
        if (!eventoOriginal) return;

        const novaData = prompt('📋 COPIAR EVENTO\nDigite a nova data (AAAA-MM-DD):', eventoOriginal.data);

        if (novaData && novaData.trim() !== '') {
            const eventoDuplicado = {
                ...eventoOriginal,
                id: Date.now() + Math.random(),
                data: novaData.trim()
            };

            agendamentos.push(eventoDuplicado);
            salvarDados();

            enviarParaGoogleSheets([eventoDuplicado]);

            alert('✅ Evento copiado e sincronizado!');
            
            atualizarSemanaPorData(novaData.trim());
            document.getElementById('weekPickerDate').value = novaData.trim();
        }
    }

    function deletarEvento(id) {
        if (confirm('Deseja remover este agendamento?')) {
            agendamentos = agendamentos.filter(ev => ev.id !== id);
            salvarDados();
            renderizarAgenda();
        }
    }

    function renderizarAgenda() {
        const isAdmin = usuarioLogado.role === 'admin';
        
        const rowNomes = document.getElementById('rowDiasNomes');
        const rowDatas = document.getElementById('rowDiasDatas');

        rowNomes.innerHTML = '<th rowspan="2" class="header-colab">COLABORADOR</th>';
        rowDatas.innerHTML = '';

        datasDaSemanaAtual.forEach(diaInfo => {
            const isEnd = diaInfo.isWeekend;
            const classText = isEnd ? 'weekend-text' : '';

            rowNomes.innerHTML += `<th class="header-day ${classText}">${diaInfo.nomeDia}</th>`;
            rowDatas.innerHTML += `<th class="header-date ${classText}">${diaInfo.dataFormatada}</th>`;
        });

        const tbody = document.getElementById('tbodyMatricial');
        tbody.innerHTML = '';

        let listaExibicao = usuarios.filter(u => u.role !== 'admin');
        if (!isAdmin) {
            listaExibicao = listaExibicao.filter(u => u.user.toLowerCase() === usuarioLogado.user.toLowerCase());
        }

        if (listaExibicao.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="padding:20px; font-weight:600; color:var(--text-muted);">Nenhum colaborador cadastrado.</td></tr>';
            return;
        }

        listaExibicao.forEach(colab => {
            const tr = document.createElement('tr');

            let tdUser = `<td class="col-colaborador">${colab.user}</td>`;
            tr.innerHTML = tdUser;

            datasDaSemanaAtual.forEach(diaInfo => {
                const evsDoDia = agendamentos.filter(ev => ev.usuario.toLowerCase() === colab.user.toLowerCase() && ev.data === diaInfo.dataISO);

                let cellHTML = '';

                evsDoDia.forEach(ev => {
                    const labelTexto = ev.funcao ? `${ev.funcao}: ${ev.local}` : ev.local;
                    
                    const acoesAdmin = isAdmin ? `
                        <div class="cell-task-actions">
                            <button class="btn-copy" onclick="duplicarEvento(${ev.id})" title="Copiar">📋</button>
                            <button class="btn-danger" onclick="deletarEvento(${ev.id})" title="Excluir">✕</button>
                        </div>
                    ` : '';

                    cellHTML += `
                        <div class="cell-task-item">
                            ${labelTexto}
                            ${acoesAdmin}
                        </div>
                    `;
                });

                const bgStyle = diaInfo.isWeekend ? 'background: rgba(15, 23, 42, 0.4);' : '';
                tr.innerHTML += `<td style="${bgStyle}">${cellHTML}</td>`;
            });

            tbody.appendChild(tr);
        });
    }

    function exportarPDF() {
        window.print();
    }

    function salvarDados() {
        localStorage.setItem('app_usuarios', JSON.stringify(usuarios));
        localStorage.setItem('app_clientes', JSON.stringify(clientes));
        localStorage.setItem('app_agendamentos', JSON.stringify(agendamentos));
    }
</script>

</body>
</html>
