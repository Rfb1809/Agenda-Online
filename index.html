<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Semanal Corporativa (Mobile & Cloud DB)</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #151d2a;
            --card-border: #232f42;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 12px; }
        .container { width: 100%; max-width: 1280px; }
        
        .card { background: var(--card-bg); padding: 18px; border-radius: 12px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 16px; }
        #login-screen { max-width: 400px; margin: 40px auto; }
        h2 { color: var(--accent); margin-bottom: 16px; text-align: center; font-size: 20px; font-weight: 700; }
        h3 { color: var(--text-main); margin-bottom: 14px; font-size: 14px; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; font-weight: 600; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        input[type="text"], input[type="password"], input[type="date"], select, textarea { width: 100%; padding: 10px 12px; background: #0b0f19; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 13px; outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        
        .checkbox-days-wrapper { background: #0b0f19; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); }
        .quick-select-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed var(--card-border); font-size: 12px; color: var(--accent); font-weight: 600; cursor: pointer; }
        .checkbox-days { display: flex; flex-wrap: wrap; gap: 8px; }
        .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-main); cursor: pointer; width: 48%; }
        .checkbox-item input[type="checkbox"], .quick-select-bar input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

        button { border: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; width: 100%; }
        .btn-pdf { background: #e11d48; color: white; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 3px 6px; font-size: 10px; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-logout { background: #232f42; color: var(--text-main); padding: 6px 12px; font-size: 12px; }
        
        .btn-toggle-dropdown { background: #0b0f19; border: 1px solid var(--card-border); color: var(--accent); width: 100%; justify-content: space-between; font-size: 12px; padding: 10px 12px; margin-bottom: 10px; border-radius: 8px; }
        .dropdown-content { background: #0b0f19; border: 1px solid var(--card-border); border-radius: 8px; padding: 10px; margin-bottom: 12px; max-height: 200px; overflow-y: auto; }
        .manage-list-item { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; border-left: 3px solid var(--accent); font-size: 12px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .user-badge { background: var(--primary); padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; }
        .week-picker-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; background: #0b0f19; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); }

        /* TABELA MATRICIAL COM SUPORTE A TOUCH / MOBILE */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; border-radius: 8px; border: 1px solid var(--card-border); }
        .excel-table { width: 100%; min-width: 700px; border-collapse: collapse; background-color: var(--card-bg); color: var(--text-main); font-size: 11px; text-align: center; }
        .excel-table th, .excel-table td { border: 1px solid var(--card-border); padding: 6px 4px; vertical-align: middle; }
        
        .excel-table th.header-colab { background: linear-gradient(135deg, #0284c7, #0369a1) !important; color: #ffffff !important; font-weight: 700; text-transform: uppercase; font-size: 10px; }
        .excel-table th.header-day { background-color: #1e293b !important; color: var(--accent) !important; font-weight: 700; font-size: 10px; }
        .excel-table th.header-date { background-color: #0f172a !important; color: var(--text-muted) !important; font-weight: 600; font-size: 9px; }
        .excel-table th.weekend-text { color: #f43f5e !important; }
        .excel-table td.col-colaborador { background-color: #1e293b !important; color: #f8fafc !important; font-weight: 700; width: 140px; text-align: left; padding-left: 8px; font-size: 10px; word-break: break-word; border-right: 2px solid var(--primary); }
        
        .cell-task-item { background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); color: #e0f2fe; padding: 4px 5px; border-radius: 4px; margin-bottom: 3px; font-weight: 600; font-size: 9px; text-transform: uppercase; text-align: left; }
        .cell-task-actions { display: flex; justify-content: flex-end; margin-top: 2px; }

        .admin-form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
        .hidden { display: none !important; }

        #syncLoader { position: fixed; top: 10px; right: 10px; background: var(--primary); color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 99999; }

        @media (max-width: 768px) {
            body { padding: 6px; }
            .card { padding: 12px; }
            .checkbox-item { width: 100%; }
            .admin-form-row { grid-template-columns: 1fr; }
        }

        @media print {
            @page { size: landscape; margin: 5mm; }
            body { background: #ffffff !important; color: #0f172a !important; padding: 0 !important; }
            .container { max-width: 100% !important; width: 100% !important; }
            #login-screen, #admin-panel, .header, .week-picker-bar, .btn-toggle-dropdown, .cell-task-actions, button, #syncLoader { display: none !important; }
            .card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
            .table-responsive { overflow: visible !important; border: none !important; }
            .excel-table { font-size: 8pt !important; width: 100% !important; background: #ffffff !important; color: #000000 !important; }
            .excel-table th, .excel-table td { border: 1px solid #cbd5e1 !important; padding: 4px 3px !important; }
            .excel-table th.header-colab { background-color: #0284c7 !important; color: #ffffff !important; }
            .excel-table th.header-day { background-color: #f1f5f9 !important; color: #0f172a !important; }
            .excel-table th.header-date { background-color: #ffffff !important; color: #475569 !important; }
            .excel-table th.weekend-text { color: #e11d48 !important; }
            .excel-table td.col-colaborador { background-color: #f8fafc !important; color: #0f172a !important; border-right: 2px solid #0284c7 !important; }
            .cell-task-item { background-color: #f0f9ff !important; border: 1px solid #bae6fd !important; color: #0369a1 !important; padding: 2px 3px !important; font-size: 7pt !important; font-weight: 700 !important; }
        }
    </style>
</head>
<body>

<div id="syncLoader">⚡ Sincronizando...</div>

<div class="container">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="card">
        <h2>🔒 Agenda Corporativa</h2>
        <form onsubmit="realizarLogin(event)">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="loginUser" required placeholder="Digite seu usuário">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPass" required placeholder="Digite sua senha">
            </div>
            <button type="submit" class="btn-primary">Entrar no Sistema</button>
        </form>
    </div>

    <!-- TELA PRINCIPAL -->
    <div id="main-screen" class="hidden">
        
        <div class="header card" style="margin-bottom: 12px; padding: 10px 16px;">
            <div>
                <span style="font-size: 14px; font-weight: 600;">👋 Olá, <span id="displayUserName" style="color: var(--accent);"></span></span>
                <span id="adminBadge" class="user-badge hidden" style="margin-left: 6px; background: var(--warning); color: #000;">ADMIN</span>
            </div>
            <button onclick="logout()" class="btn-logout">Sair</button>
        </div>

        <div id="admin-panel" class="hidden">
            
            <button class="btn-toggle-dropdown" onclick="toggleDropdown('dropdownColaboradores')">
                <span>👥 Gerenciar Colaboradores (Drive)</span>
                <span>▼</span>
            </button>
            <div id="dropdownColaboradores" class="dropdown-content hidden">
                <div id="listaColaboradoresAdmin"></div>
            </div>

            <button class="btn-toggle-dropdown" onclick="toggleDropdown('dropdownClientes')">
                <span>🏢 Gerenciar Clientes/Locais (Drive)</span>
                <span>▼</span>
            </button>
            <div id="dropdownClientes" class="dropdown-content hidden">
                <div id="listaClientesAdmin"></div>
            </div>

            <div class="card">
                <h3>👤 Cadastrar Novo Colaborador</h3>
                <form onsubmit="cadastrarUsuario(event)" class="admin-form-row">
                    <div class="form-group">
                        <label>Nome / Usuário</label>
                        <input type="text" id="newUsername" placeholder="Ex: AGNALDO TELLES" required>
                    </div>
                    <div class="form-group">
                        <label>Função Padrão</label>
                        <input type="text" id="newUserRole" placeholder="Ex: OBRA, DPM, GESTÃO" required>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="newPassword" placeholder="Senha" required>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button type="submit" class="btn-success">+ Criar Colaborador</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h3>📌 Agendar Função / Destino</h3>
                <form onsubmit="agendarTarefa(event)">
                    <div class="admin-form-row">
                        <div class="form-group">
                            <label>Colaborador 1 *</label>
                            <select id="scheduleUserSelect1" class="user-select-box" onchange="atualizarFuncaoAuto(1)" required>
                                <option value="">Carregando...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Colaborador 2 (Opcional)</label>
                            <select id="scheduleUserSelect2" class="user-select-box">
                                <option value="">Nenhum</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Prefixo / Função</label>
                            <input type="text" id="scheduleRole" placeholder="Ex: OBRA, DPM, GESTÃO" required>
                        </div>
                        <div class="form-group">
                            <label>Cliente / Local</label>
                            <input type="text" id="scheduleLocation" placeholder="Ex: SHOP_PARTAGE-DF" required list="clientesDataList">
                            <datalist id="clientesDataList"></datalist>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Selecione os Dias da Semana *</label>
                        <div class="checkbox-days-wrapper">
                            <label class="quick-select-bar">
                                <input type="checkbox" id="selectAllWeekdays" onchange="toggleSegundaSexta(this.checked)">
                                ⚡ Selecionar Semana Inteira (Segunda a Sexta)
                            </label>
                            <div class="checkbox-days" id="checkboxDaysContainer"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Instruções / Descrição Opcional</label>
                        <textarea id="scheduleDesc" rows="2" placeholder="Instruções adicionais..."></textarea>
                    </div>
                    <button type="submit" class="btn-success">Lançar na Agenda</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="week-picker-bar">
                <div style="flex: 1; min-width: 180px;">
                    <label>Selecione o Dia/Mês:</label>
                    <input type="date" id="weekPickerDate" onchange="atualizarSemanaPorData(this.value)">
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px; width: 100%;">
                    <span style="font-size: 11px; color: var(--accent); font-weight: 700;" id="weekRangeLabel"></span>
                    <button onclick="exportarPDF()" class="btn-pdf" style="width: 100%;">📄 Baixar Agenda (PDF)</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="excel-table" id="tablaAgendaMatricial">
                    <thead>
                        <tr id="rowDiasNomes"></tr>
                        <tr id="rowDiasDatas"></tr>
                    </thead>
                    <tbody id="tbodyMatricial"></tbody>
                </table>
            </div>
        </div>

    </div>

</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
<form id="googleSheetForm" method="POST" target="hidden_iframe" style="display:none;">
    <input type="hidden" name="data" id="googleSheetDataInput">
</form>

<script>
    const DIAS_NOMES_CURTOS = ["SEG", "TER", "QUA", "QUI", "SEX", "SAB", "DOM"];
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9zeHGoDDk8Tch7gBhS355k4B8CXV8BiRhZU2AVOovsnoWuwyp8phHhHyY4oZ-vhwh5Q/exec';

    let usuarios = JSON.parse(localStorage.getItem('app_usuarios')) || [
        { user: 'admin', pass: 'Rafa180993', role: 'admin', funcao: 'ADMIN' }
    ];
    let clientes = JSON.parse(localStorage.getItem('app_clientes')) || [];
    let agendamentos = JSON.parse(localStorage.getItem('app_agendamentos')) || [];
    let usuarioLogado = null;
    let datasDaSemanaAtual = [];

    window.onload = function() {
        carregarDadosDoGoogleSheets();
    };

    function mostrarLoader(show) {
        document.getElementById('syncLoader').style.opacity = show ? '1' : '0';
    }

    function salvarLocal() {
        localStorage.setItem('app_usuarios', JSON.stringify(usuarios));
        localStorage.setItem('app_clientes', JSON.stringify(clientes));
        localStorage.setItem('app_agendamentos', JSON.stringify(agendamentos));
    }

    function carregarDadosDoGoogleSheets() {
        mostrarLoader(true);
        fetch(GOOGLE_SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                if (data.usuarios && data.usuarios.length > 0) usuarios = data.usuarios;
                if (data.clientes) clientes = data.clientes;
                if (data.agendamentos) agendamentos = data.agendamentos;

                salvarLocal();

                if (usuarioLogado) {
                    atualizarSelectUsuarios();
                    renderizarListasAdmin();
                    renderizarAgenda();
                }
            })
            .catch(err => console.log("Aviso: carregando do cache local.", err))
            .finally(() => mostrarLoader(false));
    }

    function realizarLogin(e) {
        e.preventDefault();
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value.trim();

        const usuarioEncontrado = usuarios.find(user => String(user.user).toLowerCase() === u.toLowerCase() && String(user.pass) === p);

        if (usuarioEncontrado) {
            usuarioLogado = usuarioEncontrado;
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            carregarAplicacao();
        } else {
            alert('❌ Usuário ou senha incorretos!');
        }
    }

    function logout() {
        usuarioLogado = null;
        document.getElementById('main-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }

    function carregarAplicacao() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        document.getElementById('displayUserName').innerText = usuarioLogado.user;

        const isAdmin = usuarioLogado.role === 'admin';

        if (isAdmin) {
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('adminBadge').classList.remove('hidden');
            atualizarSelectUsuarios();
            renderizarListasAdmin();
        } else {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('adminBadge').classList.add('hidden');
        }

        const hojeISO = new Date().toISOString().split('T')[0];
        document.getElementById('weekPickerDate').value = hojeISO;
        
        atualizarSemanaPorData(hojeISO);
    }

    function toggleDropdown(id) {
        document.getElementById(id).classList.toggle('hidden');
    }

    function atualizarSemanaPorData(dataString) {
        if (!dataString) return;

        const partes = dataString.split('-');
        const data = new Date(Date.UTC(partes[0], partes[1] - 1, partes[2]));

        let diaDaSemana = data.getUTCDay();
        let diferencaParaSegunda = diaDaSemana === 0 ? -6 : 1 - diaDaSemana;

        const segundaFeira = new Date(data);
        segundaFeira.setUTCDate(data.getUTCDate() + diferencaParaSegunda);

        datasDaSemanaAtual = [];
        for (let i = 0; i < 7; i++) {
            const diaTemp = new Date(segundaFeira);
            diaTemp.setUTCDate(segundaFeira.getUTCDate() + i);
            const iso = diaTemp.toISOString().split('T')[0];
            const dataFmt = diaTemp.getUTCDate().toString().padStart(2, '0') + '/' + (diaTemp.getUTCMonth() + 1).toString().padStart(2, '0') + '/' + diaTemp.getUTCFullYear();
            
            datasDaSemanaAtual.push({
                nomeDia: DIAS_NOMES_CURTOS[i],
                dataISO: iso,
                dataFormatada: dataFmt,
                isWeekday: i < 5,
                isWeekend: i >= 5
            });
        }

        document.getElementById('weekRangeLabel').innerText = `Semana de ${datasDaSemanaAtual[0].dataFormatada} até ${datasDaSemanaAtual[6].dataFormatada}`;
        renderizarCheckboxesDias();
        renderizarAgenda();
    }

    function renderizarCheckboxesDias() {
        const container = document.getElementById('checkboxDaysContainer');
        if (!container) return;
        container.innerHTML = '';
        document.getElementById('selectAllWeekdays').checked = false;

        datasDaSemanaAtual.forEach(diaInfo => {
            const label = document.createElement('label');
            label.className = 'checkbox-item';
            label.innerHTML = `
                <input type="checkbox" name="selectedDay" value="${diaInfo.dataISO}" data-weekday="${diaInfo.isWeekday}" onchange="verificarToggleSemana()">
                ${diaInfo.nomeDia} (${diaInfo.dataFormatada.substring(0,5)})
            `;
            container.appendChild(label);
        });
    }

    function toggleSegundaSexta(checked) {
        document.querySelectorAll('input[name="selectedDay"]').forEach(cb => {
            if (cb.getAttribute('data-weekday') === 'true') cb.checked = checked;
        });
    }

    function verificarToggleSemana() {
        const checkboxesWeekdays = document.querySelectorAll('input[name="selectedDay"][data-weekday="true"]');
        document.getElementById('selectAllWeekdays').checked = Array.from(checkboxesWeekdays).every(cb => cb.checked);
    }

    function atualizarFuncaoAuto(colabIndex) {
        if (colabIndex === 1) {
            const username = document.getElementById('scheduleUserSelect1').value;
            const u = usuarios.find(user => user.user === username);
            if (u && u.funcao) document.getElementById('scheduleRole').value = u.funcao;
        }
    }

    function enviarRequisicaoGoogle(acao, payload) {
        mostrarLoader(true);
        const form = document.getElementById('googleSheetForm');
        const input = document.getElementById('googleSheetDataInput');
        
        form.action = GOOGLE_SCRIPT_URL + "?acao=" + acao;
        input.value = JSON.stringify(payload);
        form.submit();

        setTimeout(() => mostrarLoader(false), 1000);
    }

    function cadastrarUsuario(e) {
        e.preventDefault();
        const u = document.getElementById('newUsername').value.trim().toUpperCase();
        const f = document.getElementById('newUserRole').value.trim().toUpperCase();
        const p = document.getElementById('newPassword').value.trim();

        if (usuarios.some(user => String(user.user).toLowerCase() === u.toLowerCase())) {
            alert('⚠️ Este colaborador já está cadastrado!');
            return;
        }

        const novoUser = { user: u, pass: p, role: 'user', funcao: f || 'GERAL' };
        usuarios.push(novoUser);
        salvarLocal();
        enviarRequisicaoGoogle("salvar_usuario", novoUser);

        alert(`✅ Colaborador "${u}" salvo no banco de dados!`);
        document.getElementById('newUsername').value = '';
        document.getElementById('newUserRole').value = '';
        document.getElementById('newPassword').value = '';
        
        atualizarSelectUsuarios();
        renderizarListasAdmin();
        renderizarAgenda();
    }

    function excluirUsuario(userNome) {
        if (confirm(`Deseja remover o colaborador "${userNome}" da planilha?`)) {
            usuarios = usuarios.filter(u => String(u.user).toLowerCase() !== userNome.toLowerCase());
            agendamentos = agendamentos.filter(ev => String(ev.usuario).toLowerCase() !== userNome.toLowerCase());
            salvarLocal();
            enviarRequisicaoGoogle("deletar_usuario", { user: userNome });
            
            atualizarSelectUsuarios();
            renderizarListasAdmin();
            renderizarAgenda();
        }
    }

    function renderizarListasAdmin() {
        const containerColab = document.getElementById('listaColaboradoresAdmin');
        containerColab.innerHTML = '';
        
        const colaboradores = usuarios.filter(u => u.role !== 'admin');
        colaboradores.forEach(colab => {
            const item = document.createElement('div');
            item.className = 'manage-list-item';
            item.innerHTML = `
                <span>👤 <b>${colab.user}</b> <small style="color:var(--accent);">(${colab.funcao || 'Sem Função'})</small></span>
                <button class="btn-danger" onclick="excluirUsuario('${colab.user}')">🗑️ Excluir</button>
            `;
            containerColab.appendChild(item);
        });

        const containerClientes = document.getElementById('listaClientesAdmin');
        const datalist = document.getElementById('clientesDataList');
        containerClientes.innerHTML = '';
        datalist.innerHTML = '';

        clientes.forEach(cli => {
            const item = document.createElement('div');
            item.className = 'manage-list-item';
            item.innerHTML = `<span>🏢 <b>${cli}</b></span>`;
            containerClientes.appendChild(item);

            const opt = document.createElement('option');
            opt.value = cli;
            datalist.appendChild(opt);
        });
    }

    function atualizarSelectUsuarios() {
        const selects = document.querySelectorAll('.user-select-box');
        selects.forEach((select, index) => {
            select.innerHTML = index === 0 
                ? '<option value="">Selecione o Colaborador 1...</option>' 
                : '<option value="">Nenhum (Apenas 1 colaborador)</option>';
            
            usuarios.forEach(user => {
                if(user.role !== 'admin') {
                    const option = document.createElement('option');
                    option.value = user.user;
                    option.innerText = user.user + ` (${user.funcao || 'GERAL'})`;
                    select.appendChild(option);
                }
            });
        });
    }

    function agendarTarefa(e) {
        e.preventDefault();
        const u1 = document.getElementById('scheduleUserSelect1').value;
        const u2 = document.getElementById('scheduleUserSelect2').value;
        const funcao = document.getElementById('scheduleRole').value.trim().toUpperCase();
        const local = document.getElementById('scheduleLocation').value.trim().toUpperCase();
        const desc = document.getElementById('scheduleDesc').value.trim();

        const checkboxesMarcados = document.querySelectorAll('input[name="selectedDay"]:checked');
        const diasSelecionados = Array.from(checkboxesMarcados).map(cb => cb.value);

        if (!u1 || diasSelecionados.length === 0) {
            alert('Preencha os campos obrigatórios!');
            return;
        }

        if (local && !clientes.includes(local)) {
            clientes.push(local);
            enviarRequisicaoGoogle("salvar_cliente", { cliente: local });
        }

        const listaUsuarios = [u1];
        if (u2 && u2 !== u1) listaUsuarios.push(u2);

        let novosLancamentos = [];

        diasSelecionados.forEach(dataIso => {
            listaUsuarios.forEach(user => {
                const novoEvento = {
                    id: Date.now() + Math.random(),
                    usuario: user,
                    funcao: funcao || 'GERAL',
                    data: dataIso,
                    local: local,
                    desc: desc
                };
                agendamentos.push(novoEvento);
                novosLancamentos.push(novoEvento);
            });
        });

        salvarLocal();
        enviarRequisicaoGoogle("salvar_agendamento", novosLancamentos);

        alert(`📌 ${novosLancamentos.length} agendamento(s) salvo(s)!`);
        document.getElementById('scheduleLocation').value = '';
        document.getElementById('scheduleDesc').value = '';
        document.querySelectorAll('input[name="selectedDay"]').forEach(cb => cb.checked = false);

        renderizarListasAdmin();
        renderizarAgenda();
    }

    function deletarEvento(id) {
        if (confirm('Deseja remover este agendamento?')) {
            agendamentos = agendamentos.filter(ev => String(ev.id) !== String(id));
            salvarLocal();
            enviarRequisicaoGoogle("deletar_agendamento", { id: id });
            renderizarAgenda();
        }
    }

    function renderizarAgenda() {
        if (!usuarioLogado) return;
        const isAdmin = usuarioLogado.role === 'admin';
        
        const rowNomes = document.getElementById('rowDiasNomes');
        const rowDatas = document.getElementById('rowDiasDatas');

        rowNomes.innerHTML = '<th rowspan="2" class="header-colab">COLABORADOR</th>';
        rowDatas.innerHTML = '';

        datasDaSemanaAtual.forEach(diaInfo => {
            const classText = diaInfo.isWeekend ? 'weekend-text' : '';
            rowNomes.innerHTML += `<th class="header-day ${classText}">${diaInfo.nomeDia}</th>`;
            rowDatas.innerHTML += `<th class="header-date ${classText}">${diaInfo.dataFormatada}</th>`;
        });

        const tbody = document.getElementById('tbodyMatricial');
        tbody.innerHTML = '';

        let listaExibicao = usuarios.filter(u => u.role !== 'admin');
        if (!isAdmin) {
            listaExibicao = listaExibicao.filter(u => String(u.user).toLowerCase() === String(usuarioLogado.user).toLowerCase());
        }

        listaExibicao.forEach(colab => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-colaborador">${colab.user}</td>`;

            datasDaSemanaAtual.forEach(diaInfo => {
                const evsDoDia = agendamentos.filter(ev => String(ev.usuario).toLowerCase() === String(colab.user).toLowerCase() && ev.data === diaInfo.dataISO);

                let cellHTML = '';
                evsDoDia.forEach(ev => {
                    const labelTexto = ev.funcao ? `${ev.funcao}: ${ev.local}` : ev.local;
                    const acoesAdmin = isAdmin ? `
                        <div class="cell-task-actions">
                            <button class="btn-danger" onclick="deletarEvento('${ev.id}')" title="Excluir">✕</button>
                        </div>
                    ` : '';

                    cellHTML += `<div class="cell-task-item">${labelTexto}${acoesAdmin}</div>`;
                });

                tr.innerHTML += `<td>${cellHTML}</td>`;
            });

            tbody.appendChild(tr);
        });
    }

    function exportarPDF() {
        window.print();
    }
</script>
